# ============================================================
# Eisenhower Portfolio Manager — Nginx Configuration
# ============================================================
#
# Hardened reverse proxy serving compiled React assets and
# routing API/WebSocket traffic to the FastAPI backend.
#
# SECURITY HEADERS:
# - Content-Security-Policy (CSP): Restricts resource loading
# - X-Frame-Options: DENY — Prevents clickjacking
# - X-Content-Type-Options: nosniff — Prevents MIME sniffing
# - Strict-Transport-Security (HSTS): Forces HTTPS
# - X-XSS-Protection: Reflective XSS protection
# - Referrer-Policy: Controls referrer information
# - Permissions-Policy: Restricts browser features
#
# RATE LIMITING:
# - API requests limited to 20/second per client IP
# - WebSocket connections limited to 5/second per client IP
#
# TIMEOUTS:
# - Long timeouts for Monte Carlo simulations and exports
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------
    # Logging
    # -------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------
    # Performance
    # -------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100m;  # Allow large file uploads for artifacts

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -------------------------------------------------------
    # Rate Limiting
    # -------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=5r/s;

    # -------------------------------------------------------
    # Upstream backends
    # -------------------------------------------------------
    upstream fastapi_backend {
        server fastapi-backend:8000;
        keepalive 32;
    }

    upstream redis_backend {
        server redis:6379;
    }

    # -------------------------------------------------------
    # Security Headers Map
    # -------------------------------------------------------
    map $sent_http_content_type $referrer_policy {
        ~image/ "no-referrer";
        default "strict-origin-when-cross-origin";
    }

    # -------------------------------------------------------
    # Server block — HTTP only (local development)
    # -------------------------------------------------------
    server {
        listen 8080;
        server_name localhost;

        # ---------------------------------------------------
        # Security Headers (applied to all responses)
        # ---------------------------------------------------
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: blob: https://fastapi.tiangolo.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # ---------------------------------------------------
        # Static assets — compiled React frontend
        # ---------------------------------------------------
        root /usr/share/nginx/html;
        index index.html;

        # Cache static assets aggressively (hashed filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback — all non-file routes serve index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------------------------------------------------
        # Swagger / OpenAPI Documentation Proxy
        # ---------------------------------------------------
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------
        # API reverse proxy — /api → FastAPI backend (HTTPS)
        # ---------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass http://fastapi_backend/api/;
            proxy_http_version 1.1;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts for long-running operations (Monte Carlo, exports)
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;

            # Disable caching for API responses
            proxy_cache_bypass $http_upgrade;
            proxy_no_cache $http_upgrade;
        }

        # ---------------------------------------------------
        # WebSocket proxy — /ws → FastAPI backend (WSS)
        # ---------------------------------------------------
        location /ws/ {
            limit_req zone=ws_limit burst=10 nodelay;

            proxy_pass http://fastapi_backend/ws/;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket timeouts — keep connections alive
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # Disable buffering for real-time
            proxy_buffering off;
            proxy_cache off;
        }

        # ---------------------------------------------------
        # Health check endpoint
        # ---------------------------------------------------
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # ---------------------------------------------------
        # Deny access to hidden files
        # ---------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ---------------------------------------------------
        # Error pages
        # ---------------------------------------------------
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
