[pytest]
# Filter out deprecation warnings from SQLAlchemy's internal use of datetime.utcnow()
# These are not caused by our code and cannot be fixed without patching SQLAlchemy itself.
filterwarnings =
    ignore:datetime\.datetime\.utcnow\(\) is deprecated:DeprecationWarning:sqlalchemy

# Register custom pytest markers
markers =
    security: Dynamic Application Security Testing (DAST) and fuzzing tests
    e2e: End-to-end automated health checks for all application utilities

# Coverage configuration
[tool:pytest]
addopts = --tb=short
testpaths = tests

[coverage:run]
source = app
omit =
    */tests/*
    */__pycache__/*
    */migrations/*
    scripts/*
    deploy/*
    eisenhower.egg-info/*

[coverage:report]
show_missing = True
skip_covered = False
skip_empty = True
precision = 1
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.
    pass
    raisepass
