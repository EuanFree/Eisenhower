[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eisenhower"
version = "1.0.0"
description = "Eisenhower Portfolio Manager — Defence programme management platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "sqlglot>=23.0.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "python-dateutil>=2.8.2",
    "networkx>=3.2.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "boto3>=1.34.0",
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "python-pptx>=1.0.0",
    "python-docx>=1.1.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "python-pkcs11>=1.0.0",
    "pynacl>=1.5.0",
    "watchfiles>=0.20.0",
    "click>=8.1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[project.scripts]
eisenhower-admin = "app.cli.admin_cli:cli"

[tool.setuptools.packages.find]
include = ["app*"]
